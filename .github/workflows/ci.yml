name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        # version is read from the root package.json "packageManager" field

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Migration drift check
        run: |
          pnpm --filter @website-factory/db generate
          if [ -n "$(git status --porcelain -- packages/db/migrations)" ]; then
            echo "::error::Drizzle schema and committed migrations have drifted. Run 'pnpm --filter @website-factory/db generate' and commit the result."
            git status --porcelain -- packages/db/migrations
            exit 1
          fi

      - name: Build
        run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create local dev vars (throwaway secret, local Miniflare only)
        run: |
          cp apps/web/.dev.vars.example apps/web/.dev.vars
          sed -i "s|<generate-your-own-value-min-32-chars>|$(openssl rand -hex 32)|" apps/web/.dev.vars
          # E2E-only bootstrap admin (ADR-0015) for the staff dashboard flow.
          echo "INITIAL_ADMIN_EMAIL=e2e-admin@example.com" >> apps/web/.dev.vars

      - name: Install Playwright browser
        run: pnpm --filter @website-factory/web exec playwright install chromium --with-deps

      - name: Run E2E suite
        run: pnpm --filter @website-factory/web e2e

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
